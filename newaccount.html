<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Account</title>
</head>
<body bgcolor="#f2f2f2">

    <header align="center">
        <table width="100%" bgcolor="#198754" cellpadding="15">
            <tr>
                <td align="center">
                    <font color="white" size="6"><b>Student Portal</b></font>
                </td>
            </tr>
        </table>
    </header>

    <nav align="center">
        <table width="100%" bgcolor="#333333" cellpadding="10">
            <tr>
                <td align="center">
                    <a href="Homepage.html"><font color="white">Home</font></a>
                    &nbsp;&nbsp;&nbsp;
                    <a href="AboutUs.html"><font color="white">About Us</font></a>
                    &nbsp;&nbsp;&nbsp;
                    <a href="Login.html"><font color="white">Login</font></a>
                </td>
            </tr>
        </table>
    </nav>

    <h2 align="center">Create New Account</h2>

    <form>
        <table align="center" bgcolor="white" cellpadding="10">
            <tr>
                <td>Full Name:</td>
                <td><input type="text" name="fullname" required></td>
            </tr>
            <tr>
                <td>Student ID:</td>
                <td><input type="text" name="studentid" required></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="email" name="email" required></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" name="password" required></td>
            </tr>
            <tr>
                <td>Confirm Password:</td>
                <td><input type="password" name="confirmPassword" required></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Create Account">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
