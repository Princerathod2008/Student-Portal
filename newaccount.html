<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Student Portal</title>
</head>
<body>
    <header>
        <h1>Create Student Account</h1>
        <nav><a href="homepage.html">Home</a> | <a href="login.html">Login</a></nav>
    </header>
    <hr>
    <main>
        <section>
            <h2>Registration Form</h2>
            <form action="#" method="get">
                <fieldset>
                    <legend>Personal Information</legend>
                    <p><label for="fullname">Full Name:</label><br><input type="text" id="fullname" name="fullname" required></p>
                    <p><label for="studentid">Student ID:</label><br><input type="text" id="studentid" name="studentid" required></p>
                    <p><label for="email">Email Address:</label><br><input type="email" id="email" name="email" required></p>
                    <p><label for="phone">Phone Number:</label><br><input type="tel" id="phone" name="phone"></p>
                </fieldset>
                <fieldset>
                    <legend>Account Security</legend>
                    <p><label for="password">Create Password:</label><br><input type="password" id="password" name="password" minlength="6" required></p>
                    <p><label for="confirm">Confirm Password:</label><br><input type="password" id="confirm" name="confirm" minlength="6" required></p>
                </fieldset>
                <p><label><input type="checkbox" required> I confirm that the information is correct.</label></p>
                <p><button type="submit">Create Account</button> <button type="reset">Reset Form</button></p>
            </form>
            <p>Already registered? <a href="login.html">Login Here</a></p>
        </section>
    </main>
    <hr>
    <footer><p>© 2026 Student Portal</p></footer>
</body>
</html>
