<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration</title>
</head>
<body bgcolor="#f2f2f2">

    <header align="center">
        <table width="100%" bgcolor="#198754" cellpadding="15">
            <tr>
                <td align="center">
                    <font color="white" size="6"><b>Student Portal</b></font>
                </td>
            </tr>
        </table>
    </header>

    <nav align="center">
        <table width="100%" bgcolor="#333333" cellpadding="10">
            <tr>
                <td align="center">
                    <a href="Homepage.html"><font color="white">Home</font></a>
                    &nbsp;&nbsp;&nbsp;
                    <a href="AboutUs.html"><font color="white">About Us</font></a>
                    &nbsp;&nbsp;&nbsp;
                    <a href="Login.html"><font color="white">Login</font></a>
                </td>
            </tr>
        </table>
    </nav>

    <h2 align="center">Course Registration</h2>

    <form>
        <table align="center" bgcolor="white" cellpadding="12">
            <tr>
                <td>Student Name:</td>
                <td><input type="text" name="name" required></td>
            </tr>
            <tr>
                <td>Student ID:</td>
                <td><input type="text" name="studentid" required></td>
            </tr>
            <tr>
                <td>Select Semester:</td>
                <td>
                    <select name="semester">
                        <option>Semester 1</option>
                        <option>Semester 2</option>
                        <option>Semester 3</option>
                        <option>Semester 4</option>
                        <option>Semester 5</option>
                        <option>Semester 6</option>
                        <option>Semester 7</option>
                        <option>Semester 8</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Select Course:</td>
                <td>
                    <select name="course">
                        <option>Java</option>
                        <option>Data Structures and Algorithms</option>
                        <option>Computer Networks</option>
                        <option>Web Development</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
