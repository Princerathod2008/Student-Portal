```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration - Student Portal</title>
</head>
<body>
    <header>
        <h1>Course Registration</h1>
        <nav><a href="homepage.html">Home</a> | <a href="profile.html">Profile</a></nav>
    </header>
    <hr>
    <main>
        <section>
            <h2>Student Information</h2>
            <form action="#" method="get">
                <fieldset>
                    <legend>Personal Details</legend>
                    <p><label for="name">Full Name:</label><br><input type="text" id="name" name="name" required></p>
                    <p><label for="studentid">Student ID:</label><br><input type="text" id="studentid" name="studentid" required></p>
                    <p><label for="email">Email:</label><br><input type="email" id="email" name="email" required></p>
                    <p><label for="semester">Semester:</label><br>
                        <select id="semester" name="semester">
                            <option>Semester 1</option><option>Semester 2</option><option selected>Semester 3</option>
                            <option>Semester 4</option><option>Semester 5</option><option>Semester 6</option>
                        </select>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Select Courses</legend>
                    <p><input type="checkbox" id="java" name="course" value="Java"><label for="java"> Java Programming</label></p>
                    <p><input type="checkbox" id="cn" name="course" value="CN"><label for="cn"> Computer Networks</label></p>
                    <p><input type="checkbox" id="web" name="course" value="Web"><label for="web"> Web Development</label></p>
                    <p><input type="checkbox" id="dsa" name="course" value="DSA"><label for="dsa"> Data Structures</label></p>
                </fieldset>
                <p><button type="submit">Submit Registration</button> <button type="reset">Reset</button></p>
            </form>
        </section>
    </main>
    <hr>
    <footer><p>© 2026 Student Portal</p></footer>
</body>
</html>
```
