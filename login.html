
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Portal</title>
</head>
<body>
    <header>
        <h1>Student Portal Login</h1>
        <nav><a href="homepage.html">Home</a> | <a href="aboutus.html">About Us</a> | <a href="newaccount.html">Create Account</a></nav>
    </header>
    <hr>
    <main>
        <section>
            <h2>Login to Your Account</h2>
            <form action="#" method="get">
                <fieldset>
                    <legend>Login Details</legend>
                    <p><label for="userid">Email or Student ID:</label><br><input type="text" id="userid" name="userid" required></p>
                    <p><label for="password">Password:</label><br><input type="password" id="password" name="password" required></p>
                    <p><button type="submit">Login</button> <button type="reset">Clear</button></p>
                </fieldset>
            </form>
            <p>New student? <a href="newaccount.html">Create an Account</a></p>
        </section>
    </main>
    <hr>
    <footer><p>© 2026 Student Portal</p></footer>
</body>
</html>
